name: Build iOS IPA

on:
  push:
    branches:
      - master
      - feat/custom-v4.6.1
      - "feat/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build_ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      BOORUSAMA_USE_FVM: "false"
      OUTPUT_DIR: release-artifacts/ipa

    steps:
      - name: Check out Boorusama
        uses: actions/checkout@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version-file: .fvmrc
          cache: true

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install Apple build and packaging dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install create-dmg meson ninja nasm
          sudo gem install cocoapods

      - name: Check native build tools
        shell: bash
        run: |
          set -euo pipefail
          meson --version
          ninja --version
          nasm --version

      - name: Initialize workspace
        shell: bash
        run: |
          set -euo pipefail
          ./init.sh

      - name: Build iOS IPA artifact
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh release github build ipa \
            --ci \
            --allow-dirty \
            --no-codesign \
            --output-dir "$OUTPUT_DIR" \
            2>&1 | tee "$RUNNER_TEMP/boorusama-build.log"

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-ipa
          include-hidden-files: true
          retention-days: 7
          path: |
            ${{ runner.temp }}/boorusama-build.log
            .dart_tool/hooks_runner/**/stdout.txt
            .dart_tool/hooks_runner/**/stderr.txt
            .dart_tool/hooks_runner/**/meson-log.txt

      - name: Upload iOS IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: boorusama-ios-unsigned-ipa
          path: ${{ env.OUTPUT_DIR }}/**
          if-no-files-found: error
